name: wallet-flow

# Perekam BIDANG ⑦ (aliran wallet) - dipasang 25 Sep, POLANYA diganti 26 Sep pagi.
#
# ===== KENAPA DIGANTI (terukur 26 Sep 09:06Z) =====
# Versi pertama: cron `*/10 * * * *`. Dalam 36 menit sejak workflow ini terdaftar, cron TIDAK
# PERNAH menembak - satu-satunya jalanan adalah `workflow_dispatch` yang kukirim manual (08:29).
# Pembandingnya `universe-hourly`: cron per-jam, tapi menembak 01:29 lalu 07:35 (bolong 6 JAM).
# Untuk data yang jendela lihatnya 8-13 menit DAN tidak bisa ditarik mundur (semua parameter
# paging diabaikan server), scheduler yang suka melewatkan jam bukan pengganggu kecil: tiap jam
# yang bolong = ribuan transaksi yang hilang permanen.
#
# ===== POLA BARU: RANTAI YANG MENGHIDUPI DIRINYA SENDIRI =====
# Satu job loop ~4,6 jam (tarik + commit + push tiap ~4 menit), lalu di akhir men-dispatch
# dirinya sendiri untuk tahap berikutnya. `schedule:` tetap ada tapi TURUN PANGKAT jadi penyelamat:
# kalau rantai mati, cron jam-an menyambung ulang.
#
# Dua pagar supaya rantai tidak bisa lari sendiri:
#   1. ANTI-TUMPANG-TINDIH - kalau sudah ada jalanan `in_progress` untuk workflow ini, jalanan
#      baru berhenti di langkah pertama. Tanpa ini, cron per-jam + dispatch-diri = beberapa rantai
#      paralel yang saling merebut push.
#   2. BATAS UMUR 40 JAM - `chain_started` ikut dibawa antar-jalanan; lewat itu, rantai berhenti
#      dan menyerah ke cron. Jadi tidak ada loop yang hidup abadi tanpa pernah ada orang
#      memutuskan ulang.
#
# Kenapa commit tiap siklus (bukan satu commit di akhir): kalau runner mati di menit 200, kita
# tetap punya ~50 siklus data. Onggannya cuma sejarah git yang ramai; ongkos sebaliknya = data
# yang tidak akan pernah ada.
#
# Kenapa TIDAK butuh repository secret: terukur bahwa demo key publik membalas HTTP 200 dengan
# isi identik untuk rute ini. `GMGN_API_KEY` tetap diteruskan kalau diisi; kalau kosong, perekam
# jatuh ke demo key dengan sendirinya - tanpa 401 diam-diam.
#
# Kenapa tetap di GitHub Actions: commit-nya dibuat mesin pihak ketiga dengan timestamp server
# GitHub. Untuk dataset yang klaimnya "direkam sebelum hasilnya diketahui", jam laptop sendiri
# tidak punya nilai bukti. (Repo sudah PUBLIC, jadi menit runner bukan anggaran lagi.)

on:
  schedule:
    - cron: "17 * * * *"          # penyelamat, bukan penggerak
  workflow_dispatch:
    inputs:
      chain_started:
        description: "UTC ISO dari rantai aktif (kosongkan untuk memulai rantai baru)"
        required: false
        default: ""

permissions:
  contents: write
  actions: read

concurrency:
  group: wallet-flow-chain
  cancel-in-progress: false

jobs:
  rantai:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Berhenti kalau sudah ada rantai yang jalan (anti-tumpang-tindih)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.run_id }}
        run: |
          sleep 5
          # `.id`, BUKAN `.run_id`: di daftar run fieldnya `id`. Pakai `.run_id` menghasilkan
          # null -> "(null) != <id kita>" selalu benar -> penjaga ini MENGHITUNG DIRINYA SENDIRI.
          # Terukur 26 Sep 09:11Z: jalanan pertama rantai berhenti dalam 7 detik dengan
          # "rantai lain yang in_progress: 1", tanpa satu commit pun - yang 1 itu adalah dia.
          N=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?status=in_progress&per_page=50" \
              --jq "[.workflow_runs[] | select(.name==\"wallet-flow\" and (.id|tostring)!=\"$RUN_ID\")] | length")
          echo "rantai lain yang in_progress: [$N]"
          case "$N" in
            ''|*[!0-9]*) echo "hitungannya bukan angka -> LANJUT merekam (fail-open). " \
                          "Dedupe by transaction_hash membuat rantai paralel tidak berbahaya; " \
                          "menghentikan perekaman karena bug sendiri justru berbahaya." ;;
          esac
          if [ "$N" != "0" ] && [ -z "${N//[0-9]/}" ]; then
            echo "sudah ada rantai aktif -> keluar tanpa merekam (ini bukan kegagalan)"
            echo "RANTAI_ADA=1" >> "$GITHUB_ENV"
          else
            echo "RANTAI_ADA=0" >> "$GITHUB_ENV"
          fi

      - name: Loop ~4,6 jam - tarik, commit, push tiap ~4 menit
        if: env.RANTAI_ADA == '0'
        env:
          GMGN_API_KEY: ${{ secrets.GMGN_API_KEY }}
        run: |
          git config user.name "wallet-flow-recorder"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          END=$(( $(date +%s) + 275*60 ))
          K=0
          while [ "$(date +%s)" -lt "$END" ]; do
            K=$((K+1))
            echo "=== siklus $K $(date -u +%H:%M:%SZ) ==="
            python -u universe/record_wallet_flow.py --pulls 1 --gap 0 \
              || echo "rekam gagal di siklus $K - lanjut; satu HTTP jangan mematikan rantai"
            git add universe/wallet-flow.jsonl universe/wallet-flow-manifest.txt
            if git diff --cached --quiet; then
              echo "tidak ada baris baru di siklus $K"
            else
              git commit -q -m "wallet flow $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]" || true
              for t in 1 2 3; do
                if git -c pull.rebase=true pull --rebase -q origin "$GITHUB_REF_NAME" && git push -q; then
                  echo "push OK (percobaan $t)"; break
                fi
                echo "push gagal, retry $t"; sleep 15
              done
            fi
            sleep 200
          done
          echo "siklus selesai: $K"

      - name: Sambung rantai (batas umur 40 jam)
        if: env.RANTAI_ADA == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHAIN_IN: ${{ github.event.inputs.chain_started }}
        run: |
          START="$CHAIN_IN"
          if [ -z "$START" ]; then START=$(date -u +%Y-%m-%dT%H:%M:%SZ); fi
          AGE_H=$(( ( $(date +%s) - $(date -u -d "$START" +%s) ) / 3600 ))
          echo "umur rantai: ${AGE_H} jam (mulai $START)"
          if [ "$AGE_H" -gt 40 ]; then
            echo "BATAS UMUR TERSENTUH -> rantai berhenti; cron per-jam akan memulai rantai baru."
            exit 0
          fi
          WID=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows" \
                --jq ".workflows[] | select(.name==\"wallet-flow\") | .id")
          gh api -X POST "repos/$GITHUB_REPOSITORY/actions/workflows/$WID/dispatch" \
             -f "inputs[chain_started]=$START" && echo "rantai disambung (workflow id $WID)"

      - name: Kesehatan aliran
        if: always()
        run: |
          python -u universe/record_wallet_flow.py --report || true
          head -n 10 universe/wallet-flow-manifest.txt || true
