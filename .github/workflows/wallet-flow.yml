name: wallet-flow

# ===== DIHENTIKAN 2 Okt 2026 15:06Z (F-D81, keputusan builder) =====
# Workflow ini dan `wallet-flow-watchdog.yml` di-disable (`gh workflow disable`), rantai yang sedang jalan
# dibatalkan, SEBELUM berkas datanya lewat batas 100 MB GitHub (watch-prices 65,8 MB, naik ±16,5 MB/hari).
# Menyalakan lagi: `gh workflow enable` keduanya lalu `gh workflow run wallet-flow.yml` - tetapi pecah
# berkasnya dulu, kalau tidak batas yang sama datang lagi dalam ±2 hari.

# Perekam BIDANG ⑦ (aliran wallet) - dipasang 25 Sep, POLANYA diganti 26 Sep pagi.
#
# ===== KENAPA DIGANTI (terukur 26 Sep 09:06Z) =====
# Versi pertama: cron `*/10 * * * *`. Dalam 36 menit sejak workflow ini terdaftar, cron TIDAK
# PERNAH menembak - satu-satunya jalanan adalah `workflow_dispatch` yang kukirim manual (08:29).
# Pembandingnya `universe-hourly`: cron per-jam, tapi menembak 01:29 lalu 07:35 (bolong 6 JAM).
# Untuk data yang jendela lihatnya 8-13 menit DAN tidak bisa ditarik mundur (semua parameter
# paging diabaikan server), scheduler yang suka melewatkan jam bukan pengganggu kecil: tiap jam
# yang bolong = ribuan transaksi yang hilang permanen.
#
# ===== POLA BARU: RANTAI YANG MENGHIDUPI DIRINYA SENDIRI =====
# Satu job loop ~4,6 jam (tarik + commit + push tiap ~4 menit), lalu di akhir men-dispatch
# dirinya sendiri untuk tahap berikutnya. `schedule:` tetap ada tapi TURUN PANGKAT jadi penyelamat:
# kalau rantai mati, cron jam-an menyambung ulang.
#
# Dua pagar supaya rantai tidak bisa lari sendiri:
#   1. ANTI-TUMPANG-TINDIH - kalau sudah ada jalanan `in_progress` untuk workflow ini, jalanan
#      baru berhenti di langkah pertama. Tanpa ini, cron per-jam + dispatch-diri = beberapa rantai
#      paralel yang saling merebut push.
#   2. BATAS UMUR 40 JAM - `chain_started` ikut dibawa antar-jalanan; lewat itu, rantai berhenti
#      dan menyerah ke cron. Jadi tidak ada loop yang hidup abadi tanpa pernah ada orang
#      memutuskan ulang.
#
# Kenapa commit tiap siklus (bukan satu commit di akhir): kalau runner mati di menit 200, kita
# tetap punya ~50 siklus data. Onggannya cuma sejarah git yang ramai; ongkos sebaliknya = data
# yang tidak akan pernah ada.
#
# Kenapa TIDAK butuh repository secret: terukur bahwa demo key publik membalas HTTP 200 dengan
# isi identik untuk rute ini. `GMGN_API_KEY` tetap diteruskan kalau diisi; kalau kosong, perekam
# jatuh ke demo key dengan sendirinya - tanpa 401 diam-diam.
#
# Kenapa tetap di GitHub Actions: commit-nya dibuat mesin pihak ketiga dengan timestamp server
# GitHub. Untuk dataset yang klaimnya "direkam sebelum hasilnya diketahui", jam laptop sendiri
# tidak punya nilai bukti. (Repo sudah PUBLIC, jadi menit runner bukan anggaran lagi.)

on:
  # TIDAK ADA `schedule:` di berkas ini lagi - dan ini koreksi atas keputusan yang kutulis sendiri.
  # Terukur 28 Sep 08:24Z (jam = header server GitHub, bukan jam laptop): run #11/#12/#13
  # conclusion=`cancelled`, dan yang membatalkan adalah cron penyelamat di berkas yang SAMA -
  # `schedule` menembak tiap jam sementara satu rantai hidup berjam-jam, dan dengan
  # `cancel-in-progress: true` tiap tembakan mematikan rantai yang sedang merekam.
  # Penyelamatnya membunuh pasiennya, dan pola itu terbaca "sehat" kalau orang cuma melihat
  # daftar run per jam. Penyelamat sekarang = berkas terpisah `wallet-flow-watchdog.yml` dengan
  # grup concurrency sendiri: dia tidak bisa membatalkan rantai, hanya men-dispatch kalau basi.
  workflow_dispatch:
    inputs:
      chain_started:
        description: "UTC ISO dari rantai aktif (kosongkan untuk memulai rantai baru)"
        required: false
        default: ""

permissions:
  contents: write
  # `actions: write` WAJIB ada di sini. Tanpanya langkah "sambung rantai" cuma bisa membaca dan
  # dispatch-diri gagal - terukur 26 Sep: run 09:15Z `conclusion=failure` tepat di langkah itu.
  # Rantai yang tidak bisa menyambung dirinya sendiri itu janji kosong, dan tidak ada yang sadar
  # sampai seseorang melihat jam terakhir commit.
  actions: write

concurrency:
  # Grup HANYA untuk workflow ini. Watchdog sengaja di berkas berbeda supaya dia tidak pernah
  # masuk grup yang sama dengan yang dia hidupkan.
  group: wallet-flow-chain
  # `true`, bukan `false`. KOREKSI ATAS DIRIKU SENDIRI (27 Sep): commit sebelumnya menulis bahwa
  # `false` "membungkam perekam selama 24 jam". Itu SALAH. Sebabnya layak dicatat: aku membaca
  # salinan LAPTOP-ku (5.676 baris, terakhir 11:38Z) sebagai keadaan sistem, padahal working
  # copy-ku yang 78 commit tertinggal. Di origin perekam terus mengirim commit
  # (17:51 -> 17:54 -> 17:57 -> 18:01 -> 18:04Z) dan setelah dijalankan ulang commit berikutnya
  # lahir 18:10Z. Lubang nyatanya ±6 MENIT, bukan 24 jam.
  #
  # Yang tetap benar dari perubahan ini: dengan `false`, SATU jalanan yang menggantung akan
  # mengantrikan semua berikutnya dan satu-satunya jalan keluar adalah tangan manusia membatalkan
  # manual. Dengan `true`, cron berikutnya mengganti yang macet sendiri. Alasannya berubah dari
  # "kita kehilangan sehari" jadi "kita tidak mau butuh tangan manusia" - dan itu tetap cukup kuat.

  # KOREKSI KEDUA (28 Sep): `true` justru menjadi lubang yang paling mahal. Dengan `schedule` di
  # berkas yang sama, `true` berarti tiap jam rantai yang sedang merekam DIBUNUH (lihat di atas).
  # Sekarang `false`: rantai yang menggantung tetap punya batas, tapi bukan lewat pembatalan -
  # lewat `timeout-minutes: 330` di job ini, yang membunuh yang macet tanpa menyentuh yang hidup.
  # Watchdog juga memeriksa `in_progress` sebelum dispatch, jadi tidak ada antrean tanpa batas.
  cancel-in-progress: false

jobs:
  rantai:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Berhenti kalau sudah ada rantai yang jalan (anti-tumpang-tindih)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.run_id }}
        run: |
          sleep 5
          # `.id`, BUKAN `.run_id`: di daftar run fieldnya `id`. Pakai `.run_id` menghasilkan
          # null -> "(null) != <id kita>" selalu benar -> penjaga ini MENGHITUNG DIRINYA SENDIRI.
          # Terukur 26 Sep 09:11Z: jalanan pertama rantai berhenti dalam 7 detik dengan
          # "rantai lain yang in_progress: 1", tanpa satu commit pun - yang 1 itu adalah dia.
          N=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?status=in_progress&per_page=50" \
              --jq "[.workflow_runs[] | select(.name==\"wallet-flow\" and (.id|tostring)!=\"$RUN_ID\")] | length")
          echo "rantai lain yang in_progress: [$N]"
          case "$N" in
            ''|*[!0-9]*) echo "hitungannya bukan angka -> LANJUT merekam (fail-open). " \
                          "Dedupe by transaction_hash membuat rantai paralel tidak berbahaya; " \
                          "menghentikan perekaman karena bug sendiri justru berbahaya." ;;
          esac
          if [ "$N" != "0" ] && [ -z "${N//[0-9]/}" ]; then
            echo "sudah ada rantai aktif -> keluar tanpa merekam (ini bukan kegagalan)"
            echo "RANTAI_ADA=1" >> "$GITHUB_ENV"
          else
            echo "RANTAI_ADA=0" >> "$GITHUB_ENV"
          fi

      - name: Loop ~4,6 jam - tarik, commit, push tiap ~4 menit
        if: env.RANTAI_ADA == '0'
        env:
          GMGN_API_KEY: ${{ secrets.GMGN_API_KEY }}
        run: |
          git config user.name "wallet-flow-recorder"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Driver merge untuk berkas data (lihat .gitattributes). Tanpa ini `merge=ours` di
          # .gitattributes adalah nama tanpa isi dan konflik tetap konflik.
          git config merge.ours.driver true
          # Rekaman LOKAL di luar rantai ini tidak boleh membuat runner gagal push: kalau
          # rebase berbenturan, buang commit lokal kita (barisnya tetap ada di origin) dan
          # lanjut - bolong satu siklus lebih baik daripada buta tiga jam seperti 28 Sep.
          git config pull.rebase true
          END=$(( $(date +%s) + 275*60 ))
          K=0
          while [ "$(date +%s)" -lt "$END" ]; do
            K=$((K+1))
            echo "=== siklus $K $(date -u +%H:%M:%SZ) ==="
            python -u universe/record_wallet_flow.py --pulls 1 --gap 0 \
              || echo "rekam gagal di siklus $K - lanjut; satu HTTP jangan mematikan rantai"
            # P17: perpanjang pantauan harga 2 jam ke token yang sudah keluar dari daftar panas.
            # Tanpa ini 80,6 % kejadian tidak punya harga keluar (diukur tools/flow_cluster_test.py).
            # Sengaja TIDAK boleh mematikan rantai: kalau DexScreener mati, perekam utama jalan terus.
            # --max-batches 40 = sampai ~1.200 alamat/siklus. Bukan demi angka yang lebih besar:
            # dengan daftar pantau 400-900 token, 6 batch (180 alamat) membuat sisanya TIDAK PERNAH
            # DITANYA - dan itu terbaca sebagai 'pool mati' oleh tools/presence_ledger.py. Yang ditanya
            # harus seluas yang kita simpulkan.
            python -u universe/record_watch_prices.py --watch-min 120 --max-batches 40 \
              || echo "watchPrices gagal di siklus $K - lanjut"
            # ⑨ BUKU ORDER - teori builder (29 Sep): "jumlahkan variasi harga sisi beli, kurangi sisi
            # jual". Kami baru punya endpointnya, bukan historinya; satu-satunya cara menguji teori
            # buku order adalah menjalankan jamnya. Limit 25 simbol x ~200 detik = cukup untuk
            # membedakan 'perekam mati' dari 'bukunya tipis'.
            python -u universe/record_book_depth.py --limit-simbol 25 --gap 1.0 \
              || echo "book_depth gagal di siklus $K - lanjut"
            # P40 - JALUR CEPAT: keputusan diambil atas berkas yang BARU SAJA ditulis, pada runner
            # yang sama, jadi "berapa lama dari kejadian sampai kami memutuskan" terukur dan bukan
            # diklaim. E11 (tools/horizon_decay.py) mengukur kabar itu hidup sekitar dua menit;
            # latensi data kami 0,2 menit (stempel commit GitHub). Kalau alat ini gagal, rantai
            # tetap jalan - dia perekam keputusan, bukan penahan aliran.
            python -u tools/fast_lane.py --run --per-run 3 || echo "fast_lane gagal di siklus $K - lanjut"
            git add universe/wallet-flow.jsonl universe/wallet-flow-manifest.txt \
                    universe/watch-prices.jsonl universe/watch-prices-manifest.txt \
                    universe/book-depth.jsonl universe/book-depth-manifest.txt \
                    decisions/fast-lane.jsonl
            if git diff --cached --quiet; then
              echo "tidak ada baris baru di siklus $K"
            else
              git commit -q -m "wallet flow $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]" || true
              PUSHED=0
              for t in 1 2 3; do
                if git -c pull.rebase=true pull --rebase -q origin "$GITHUB_REF_NAME" \
                   && git push -q; then
                  echo "push OK (percobaan $t)"; PUSHED=1; break
                fi
                echo "push gagal di percobaan $t - reset ke origin dan lanjut"
                git rebase --abort 2>/dev/null || true
                git reset --hard -q "origin/$GITHUB_REF_NAME" || true
                sleep 15
              done
              if [ "$PUSHED" = "0" ]; then
                echo "::warning::rantai tidak bisa push 3x berturut - data menumpuk lokal saja."
                echo "RANTAI_PUSH_BASI=1" >> "$GITHUB_ENV"
              fi
            fi
            sleep 200
          done
          echo "siklus selesai: $K"

      - name: Sambung rantai (batas umur 40 jam)
        if: env.RANTAI_ADA == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHAIN_IN: ${{ github.event.inputs.chain_started }}
        run: |
          START="$CHAIN_IN"
          if [ -z "$START" ]; then START=$(date -u +%Y-%m-%dT%H:%M:%SZ); fi
          AGE_H=$(( ( $(date +%s) - $(date -u -d "$START" +%s) ) / 3600 ))
          echo "umur rantai: ${AGE_H} jam (mulai $START)"
          if [ "$AGE_H" -gt 40 ]; then
            echo "BATAS UMUR TERSENTUH -> rantai berhenti; wallet-flow-watchdog yang menyalakan lagi."
            echo "(watchdog membaca umur aliran dari manifest, bukan dari janji kita)"
            exit 0
          fi
          WID=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows" \
                --jq ".workflows[] | select(.name==\"wallet-flow\") | .id")
          # Endpointnya `dispatches` (JAMAK) dan body-nya harus objek bersarang:
          #   {"ref": "<branch>", "inputs": {"chain_started": "<iso>"}}
          # Versi pertama menulis `$WID/dispatch` (tunggal, 404) dengan `-f "inputs[chain_started]=..."`
          # yang dikirim sebagai key literally `inputs[chain_started]` - dua-dunya salah, dan
          # kegagalan itu tidak kelihatan berhari-hari karena rantai tetap jalan oleh cron.
          printf '{"ref":"%s","inputs":{"chain_started":"%s"}}' "$GITHUB_REF_NAME" "$START" \
            | gh api -X POST "repos/$GITHUB_REPOSITORY/actions/workflows/$WID/dispatches" --input - \
            && echo "rantai disambung (workflow id $WID, ref $GITHUB_REF_NAME)" \
            || { echo "GAGAL menyambung rantai -> aliran akan bolong sampai watchdog menyalakan"; exit 1; }

      - name: Teriak kalau kita buta push (bukan fail pipeline - data yang ada tetap berharga)
        if: env.RANTAI_PUSH_BASI == '1'
        run: |
          echo "::error::3x push gagal - rantai merekam tapi TIDAK sampai ke origin. Ini bentuk"
          echo "  kegagalan yang membuat aliran bolong berjam-jam tanpa ada run yang merah."
          exit 1

      - name: Kesehatan aliran
        if: always()
        run: |
          python -u universe/record_wallet_flow.py --report || true
          head -n 10 universe/wallet-flow-manifest.txt || true
