name: paper-ledger

# M2 (F-D74/F-D75) - ledger paper MAJU per bot dijalankan MESIN, bukan diingat-ingat.
#
# Kenapa job sendiri: bukti bahwa sinyal sudah ada SEBELUM hasilnya hanya bernilai bila cap waktunya berasal dari pihak yang bukan kami. Commit job ini
# dibuat oleh runner GitHub dengan jam server GitHub, jadi "tick hari X ada sebelum bar X+1 menutup" bisa diperiksa orang lewat riwayat git, bukan dipercaya
# dari jam laptop (jam laptop = lemah, dan ia tidur). Ini sama dengan alasan universe-hourly dan paper-book.
#
# Apa yang dilakukan (semuanya stdlib, tanpa pip):
#   1. tools/feed_bars.py   - memperpanjang ledger/bars/*.csv dengan bar harian yang SUDAH tertutup (Binance Vision, berkas statis) + funding
#                             (REST dulu, cadangan: zip bulanan). Yang belum terbit TIDAK diisi dan TIDAK ditebak.
#   2. tools/paper_tick.py  - per bot yang punya genesis: `gap` untuk hari terlewat, `tick` (niat posisi) untuk bar tertutup terakhir bila <= 12 jam
#                             sejak penutupan, `settle` untuk bar yang kini bisa ditutup (menunggu funding bila belum ada; tidak diisi nol).
#   3. engine.cli ledger verify - rantai hash + HITUNG ULANG setiap tick/settle dari bar. Gagal = job merah (jangan commit ledger yang tak bisa diperiksa).
#
# Jadwal: tujuh putaran sehari, 08:47Z dan 09:07-11:37Z tiap 30 menit - dipasang di sekitar JAM TERBIT berkas, bukan pagi buta. Terukur 2 Okt dari daftar bucket S3
# `data.binance.vision` (LastModified): berkas harian 2026-09-30 terbit 1 Okt 09:37-09:39Z; BTCUSDT 2026-10-01 terbit 2 Okt 08:44:04Z dan XRPUSDT belum ada pada 08:54Z.
# Jadi bar hari X baru ada ±8,7-9,7 jam sesudah penutupan, TIDAK serempak antar simbol; putaran sebelum 08:47Z sia-sia dan tidak dijadwalkan. Tiap putaran idempoten
# (tick yang sudah ada tidak ditambah lagi). Batas tick = 12 jam sesudah penutupan (12:00Z): lewat itu hari dicatat `gap`, TIDAK diisi belakangan. Cron GitHub bisa
# terlambat beberapa menit (kadang lebih); jendela yang sempit (±2-3 jam antara terbit dan batas) berarti beberapa `gap` memang mungkin - terlihat, bukan diam.
#
# Batas yang jujur: (a) funding REST TERBLOKIR dari runner (terukur 2 Okt, run 36987654079: HTTP 451); `settle` final menunggu zip bulanan (terbit awal bulan berikutnya) - `tick` jalan terus.
#     Sebagai gantinya feed membangun ESTIMASI funding dari berkas harian premiumIndexKlines (P92/F-D76; `ledger/bars/fund_est_*.csv`), hanya untuk laporan PROVISIONAL, bukan settle final.
# (b) Tidak ada kunci, tidak ada transaksi chain, tidak ada rahasia di sini: anchor kepala ledger (bila diinginkan) dibuat dari mesin lokal, bukan dari Actions.
# (c) Paper penuh: tidak ada uang nyata. Angka maju bukan klaim edge (F-D16).
# (d) Karena bar baru ada ±9 jam sesudah penutupan, tick keluar ±9-10 jam sesudah 00:00Z: niat tetap ex-ante terhadap hasil bar berikutnya, tetapi harga masuk 00:00Z tidak
#     bisa didapat pengikut pada saat itu, sedangkan `settle` mengandaikan masuk di harga penutupan (konvensi replay). Sumber waktu-nyata (mis. kline REST dari runner bila
#     terjangkau) menyusul; sampai itu ada, jeda tampil di laporan (`jeda tick`).

on:
  schedule:
    - cron: "47 8 * * *"
    - cron: "7,37 9-11 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: paper-ledger
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bar -> tick / gap / settle -> laporan
        run: |
          set +e
          python -u -X utf8 tools/paper_tick.py --feed
          rc=$?
          echo "paper_tick rc=$rc (0 beres; 4 tick belum bisa dibuat, coba putaran berikutnya; selain itu gagal)"
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 4 ]; then exit "$rc"; fi

      - name: Verifikasi ulang seluruh ledger dari bar (nol kunci, nol gas)
        run: python -u -X utf8 -m engine.cli ledger verify

      - name: Commit + dorong (dengan retry; kalau push gagal, JANGAN diam)
        run: |
          git config user.name "paper-ledger"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ledger/paper ledger/bars
          if git diff --cached --quiet; then
            echo "ledger tidak berubah pada putaran ini"
            exit 0
          fi
          git commit -q -m "ledger paper $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
          for t in 1 2 3 4 5; do
            if git pull --rebase -q origin "$GITHUB_REF_NAME" && git push -q; then
              echo "push OK (percobaan $t)"; exit 0
            fi
            echo "push ditolak (percobaan $t) - rantai data lain mungkin bergerak duluan"
            sleep 12
          done
          echo "::error::5x push gagal - ledger tercatat di runner tapi tidak sampai ke branch"
          exit 1
