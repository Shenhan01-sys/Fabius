[profile.default]
src = "contracts"
out = "out"
test = "test"
script = "script"
# Dependensi lewat SUBMODULE di `vendor/`, bukan junction: repo harus bisa di-clone dan
# `forge test`-nya jalan di mesin orang lain. Junction `lib/` + `node_modules/` yang lama cuma
# hidup di mesin ini dan di-`gitignore` - itulah sebabnya clone pertama dulu sama sekali tidak bisa
# build. Setelah clone: `git submodule update --init --depth 1`.
libs = ["vendor", "lib"]
solc_version = "0.8.26"
# Kontrak ini tidak memakai opcode Cancun; target lebih rendah = bytecode jalan di lebih banyak
# chain. FORK TEST tetap wajib pakai profile.fork — pelajaran yang sudah dibayar di
# _research/x402-bnb-poc dan app/foundry.toml (`EvmError: NotActivated` saat fork di shanghai).
evm_version = "shanghai"
optimizer = true
optimizer_runs = 200
verbosity = 2

# Berkas x402 TIDAK dikompilasi di profil default, dan alasannya spesifik: `X402DemoToken` memakai
# ERC20Permit (EIP-2612) yang di OpenZeppelin 5 menyeret `utils/Bytes.sol`, dan Bytes.sol memakai
# opcode `mcopy` (Cancun). Terukur 26 Sep: tanpa baris ini `forge build` gagal 4x di
# vendor/openzeppelin/contracts/utils/Bytes.sol while compiling for "shanghai".
# Kenapa tidak sekalian Cancun di sini: `DecisionAnchor` sengaja ditarget shanghai (lihat atas) dan
# klaim "bytecode 4748 B identik dengan build lokal" (vault/07) terikat ke target itu.
# Kenapa tidak proyek bersarang: sudah dicoba dan mati di `allow_paths` (butuh pola, bukan boolean;
# dan tetap menolak resolve lintas root) - satu proyek + `skip` justru tidak perlu mengajari
# Foundry cara membaca direktori orang.
skip = ["X402DemoToken", "X402SettleOnBsc"]

[profile.fork]
src = "contracts"
out = "out"
test = "test"
script = "script"
libs = ["vendor", "lib"]
solc_version = "0.8.26"
evm_version = "cancun"
# Profil fork MEMBANGUN kembali berkas x402 (kosongkan skip) - di sinilah test settlement
# (`Settled()` / `SettledWithPermit()` pada proxy kanonis yang sudah ter-deploy) dijalankan:
#   set FOUNDRY_PROFILE=fork && forge test --fork-url bscTestnet
skip = []
optimizer = true
optimizer_runs = 200
verbosity = 2

[rpc_endpoints]
# Endpoint diwarisi apa adanya dari app/foundry.toml, termasuk catatan kenapa yang populer dipilih.
# `data-seed-prebsc-1-s1/-s2` terbukti rewel dari mesin ini; `bsc-dataseed.binance.org` pernah
# ditolak Foundry karena sertifikat kedaluwarsa (host yang sama sempat melayani lewat IP lain).
# Untuk memilih endpoint yang hidup SEKARANG, jalankan ulang _research/find_bsc_testnet_rpc.py.
bscTestnet = "https://bsc-testnet.publicnode.com"
bscTestnetB = "https://data-seed-prebsc-1-s2.binance.org:8545/"
bscTestnetC = "https://data-seed-prebsc-1-s3.binance.org:8545/"
bscTestnetD = "https://bsc-testnet.drpc.org"
bsc = "https://bsc-dataseed1.bnbchain.org/"

[fuzz]
runs = 256
